spring.application.name=reservations-springboot
spring.application.frontend-url=http://localhost:8080

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/reservations?useSSL=false&serverTimezone=Europe/Brussels
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Configuration Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Configuration Spring MVC
spring.mvc.hiddenmethod.filter.enabled=true

# Configuration e-mail : variables à définir
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
