
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Liste des représentations</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 th:text="${title}">
            Liste des représentations
        </h1>

        <ul th:unless="${#lists.isEmpty(representations)}">

            <li th:each="representation : ${representations}">

                <span th:text="${representation.show.title}">
                    Ayiti
                </span>

                <span th:if="${representation.location != null}"
                      th:text="' - ' + ${representation.location.designation}">
                    - Art Center
                </span>

                <span th:if="${representation.when != null}"
                      th:text="${#temporals.format(representation.when, 'dd-MM-yyyy')}">
                    12-10-2012
                </span>

                <span th:if="${representation.when != null}"
                      th:text="${#temporals.format(representation.when, 'HH:mm')}">
                    13:30
                </span>

                <a th:href="@{/representations/{id}(id=${representation.id})}">
                    Voir
                </a>

            </li>
        </ul>

        <p th:if="${#lists.isEmpty(representations)}">
            Aucune représentation disponible.
        </p>

    </div>
</body>
</html>
