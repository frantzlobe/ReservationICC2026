```html
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Header fragment</title>
</head>

<body>
<header class="navbar navbar-inverse navbar-fixed-top" th:fragment="header">
    <div class="container">

        <div class="navbar-header">
            <h1>
                <a class="navbar-brand" th:href="@{/}">Réservations</a>
            </h1>
        </div>

        <div class="navbar-collapse collapse">
            <ul class="nav navbar-nav">
                <li th:classappend="${module == 'home' ? 'active' : ''}">
                    <a th:href="@{/}">Accueil</a>
                </li>

                <li th:classappend="${module == 'artists' ? 'active' : ''}">
                    <a th:href="@{/artists}">Artistes</a>
                </li>
            </ul>
        </div>

        <div style="float:right">

            <!-- Visiteur non connecté -->
            <div sec:authorize="!isAuthenticated()">
                <p>Vous n'êtes pas connecté.</p>

                <a th:href="@{/login}" class="nav-link">
                    Se connecter
                </a>
                <br><br>

                <a th:href="@{/register}" class="nav-link">
                    S'inscrire
                </a>
            </div>

            <!-- Utilisateur connecté -->
            <div sec:authorize="isAuthenticated()">

                <p>
                    Bonjour
                    <span sec:authentication="principal.username">Utilisateur</span> !
                </p>

                <p>
                    <a th:href="@{/profile}" class="nav-link">
                        Mon profil
                    </a>
                </p>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="unset">
                        Se déconnecter
                    </button>
                </form>

            </div>

        </div>
    </div>
</header>
</body>
</html>
```
